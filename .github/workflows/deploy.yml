name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Backup copy on Cloudflare Pages (see README, "Backup address"). Stays off until the
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets exist.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'jawaharchiluveru' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Site URL and base path for wherever Pages serves the site (github.io subpath or custom domain).
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist
      # The same build, published as a backup address on Cloudflare Pages for visitors whose network
      # blocks the main domain. Search engines are told not to index it (the canonical URL stays the
      # main domain). A failure here never stops the main deploy.
      # Prints yes/no answers only (never the token or account ID) so a setup problem is easy to spot.
      - name: Check Cloudflare access for the backup copy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        continue-on-error: true
        run: |
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          ok() { jq -r 'if .success then "yes" else "no: " + ([.errors[]? | "\(.code) \(.message)"] | join("; ")) end'; }
          echo "Token length: ${#CLOUDFLARE_API_TOKEN} characters; account ID length: ${#CLOUDFLARE_ACCOUNT_ID} (should be 32)"
          case "$CLOUDFLARE_API_TOKEN$CLOUDFLARE_ACCOUNT_ID" in *[[:space:]]*) echo "WARNING: a secret contains a space or line break";; esac
          echo "1. Token valid and active? $(api /user/tokens/verify | ok)"
          echo "2. Token can see the account? $(api /accounts/$CLOUDFLARE_ACCOUNT_ID | ok)"
          echo "3. Token can use Cloudflare Pages there? $(api /accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects | ok)"
      - name: Publish backup copy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        continue-on-error: true
        run: |
          cp -r apps/web/dist mirror
          printf '/*\n  X-Robots-Tag: noindex\n' > mirror/_headers
          npx --yes wrangler@4.45.0 pages project create "$CF_PAGES_PROJECT" --production-branch=main || true
          npx --yes wrangler@4.45.0 pages deploy mirror --project-name="$CF_PAGES_PROJECT" --branch=main --commit-dirty=true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
