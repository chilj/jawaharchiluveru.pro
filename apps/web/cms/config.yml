# Sveltia CMS configuration for the content editor at /admin.
# Every save is a commit to `main`, which redeploys the site (trunk-based).
backend:
  name: github
  repo: chilj/jawaharchiluveru.pro
  branch: main
  auth_methods: [token]
  commit_messages:
    create: 'Add {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Remove {{collection}} "{{slug}}"'
    uploadMedia: 'Upload "{{path}}"'
    deleteMedia: 'Remove "{{path}}"'

media_folder: content/public/files
public_folder: /files
site_url: https://www.jawaharchiluveru.pro
display_url: https://www.jawaharchiluveru.pro

collections:
  - name: profile
    label: Profile & settings
    files:
      - name: about
        label: About
        file: content/about.md
        fields:
          - { name: name, label: Name, widget: string }
          - { name: role, label: Role, widget: string }
          - { name: location, label: Location, widget: string, required: false }
          - { name: tagline, label: Tagline, widget: text, hint: One or two sentences under your name. }
          - { name: seo_title, label: Search title, widget: string, required: false, hint: 'Browser tab and search result title. Keep under 60 characters. Default: Name | Role.' }
          - { name: description, label: Search description, widget: text, hint: 'Shown in search results and link previews. Keep to about 150 characters.' }
          - { name: social_image, label: Social preview image, widget: image, required: false, hint: 'Shown when the site is shared on LinkedIn, Slack or X. Use 1200×630 pixels (PNG or JPG).' }
          - { name: social_image_alt, label: Social preview image description, widget: text, required: false, hint: 'Describe the image for screen readers.' }
          - { name: site_icon, label: Site icon (large), widget: image, required: false, hint: 'Square image, at least 512×512. Used for phone home screens and other large icons. Leave empty to use the JC icon in your theme colors.' }
          - { name: site_icon_small, label: Site icon (small), widget: image, required: false, hint: 'A simple version for browser tabs and Google results (shown at 16–48 pixels). SVG is best; fine detail disappears at these sizes. Leave empty to use the large icon.' }
          - name: stats
            label: Headline numbers
            widget: list
            fields:
              - { name: value, label: Value, widget: string, hint: 'e.g. 16+' }
              - { name: label, label: Label, widget: string }
          - { name: body, label: Bio, widget: markdown }

      - name: resume
        label: Résumé
        file: content/resume.yaml
        fields:
          - { name: file, label: Résumé PDF, widget: file, accept: application/pdf, hint: 'Upload a new PDF to replace the current one. It goes live about a minute after you save, at the same permanent link: jawaharchiluveru.pro/resume.pdf' }
          - { name: show, label: Show the Résumé button, widget: boolean, default: true }
          - { name: label, label: Button text, widget: string, default: Résumé }
          - { name: download_name, label: File name for visitors, widget: string, default: Jawahar-Chiluveru-Resume.pdf, pattern: ['^[A-Za-z0-9._-]+\.pdf$', 'Letters, numbers, dots, dashes or underscores, ending in .pdf'], hint: 'Also published at jawaharchiluveru.pro/<this name>, so saved copies are named clearly.' }
          - { name: updated, label: Last updated, widget: datetime, type: date, required: false, hint: Shown when visitors hover the button. }

      - name: connect
        label: Let's Talk
        file: content/connect.md
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: intro, label: Intro, widget: text, required: false }
          - name: booking
            label: Calendar booking
            widget: object
            fields:
              - { name: label, label: Button text, widget: string, default: Book a 30-minute call }
              - { name: url, label: Booking link, widget: string, required: false, hint: 'Your Calendly, Cal.com or Google Calendar appointment link. Leave empty to hide the button.' }
              - { name: embed, label: Show the calendar on the page, widget: boolean, default: false }
          - { name: email, label: Email, widget: string, required: false }
          - name: links
            label: Links
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: url, label: URL, widget: string }
          - name: meeting
            label: Meeting request form
            widget: object
            collapsed: true
            hint: 'Visitors pick an open slot; submitting opens their email app with the request addressed to you. No booking happens until you reply.'
            fields:
              - { name: enabled, label: Show the form, widget: boolean, default: true }
              - { name: heading, label: Heading, widget: string, default: Request a meeting }
              - { name: intro, label: Intro, widget: text, required: false }
              - { name: timezone, label: Your time zone, widget: select, default: America/Chicago, options: [{ label: 'US Central (Dallas–Fort Worth)', value: America/Chicago }, { label: US Eastern, value: America/New_York }, { label: US Mountain, value: America/Denver }, { label: US Pacific, value: America/Los_Angeles }, { label: UK, value: Europe/London }, { label: India, value: Asia/Kolkata }] }
              - { name: days, label: Available days, widget: select, multiple: true, default: [mon, tue, wed, thu, fri], options: [{ label: Monday, value: mon }, { label: Tuesday, value: tue }, { label: Wednesday, value: wed }, { label: Thursday, value: thu }, { label: Friday, value: fri }, { label: Saturday, value: sat }, { label: Sunday, value: sun }] }
              - { name: start, label: Day starts at, widget: string, default: '09:00', pattern: ['^([01]\d|2[0-3]):[0-5]\d$', '24-hour time, e.g. 09:00'] }
              - { name: end, label: Day ends at, widget: string, default: '17:00', pattern: ['^([01]\d|2[0-3]):[0-5]\d$', '24-hour time, e.g. 17:00'] }
              - { name: length, label: Meeting length (minutes), widget: select, default: 30, options: [{ label: '15', value: 15 }, { label: '30', value: 30 }, { label: '45', value: 45 }, { label: '60', value: 60 }] }
              - { name: min_notice_hours, label: Minimum notice (hours), widget: number, value_type: int, default: 24, min: 0 }
              - { name: weeks_ahead, label: Weeks ahead to offer, widget: number, value_type: int, default: 3, min: 1, max: 12 }
              - { name: blocked_dates, label: Unavailable dates, widget: list, required: false, field: { name: date, label: Date, widget: datetime, type: date }, hint: 'Holidays, travel or busy days.' }

      - name: theme
        label: Theme & colors
        file: content/theme.yaml
        fields:
          - { name: preset, label: Color scheme, widget: select, default: ocean, options: [{ label: 'Ocean (blue & teal)', value: ocean }, { label: 'Emerald (green & blue)', value: emerald }, { label: 'Indigo (violet & pink)', value: indigo }, { label: 'Graphite (slate & teal)', value: graphite }, { label: 'Sunset (orange & purple)', value: sunset }, { label: 'Crimson (red & navy)', value: crimson }], hint: 'Applies to light and dark mode. Custom colors below override it.' }
          - name: custom
            label: Custom colors (optional)
            widget: object
            collapsed: true
            hint: 'Leave empty to use the scheme above. Hard-to-read colors are adjusted automatically to keep text accessible.'
            fields:
              - name: light
                label: Light mode
                widget: object
                fields:
                  - { name: accent, label: 'Accent (links, buttons, headings)', widget: color, allowInput: true, required: false }
                  - { name: secondary, label: 'Secondary (gradients, highlights)', widget: color, allowInput: true, required: false }
              - name: dark
                label: Dark mode
                widget: object
                fields:
                  - { name: accent, label: 'Accent (links, buttons, headings)', widget: color, allowInput: true, required: false }
                  - { name: secondary, label: 'Secondary (gradients, highlights)', widget: color, allowInput: true, required: false }

      - name: analytics
        label: Analytics
        file: content/analytics.yaml
        fields:
          - { name: clarity_id, label: Microsoft Clarity project ID, widget: string, required: false, pattern: ['^([a-zA-Z0-9]{6,20})?$', 'Letters and numbers only, e.g. abc123xyz9'], hint: 'Visits, heatmaps, session recordings and events. clarity.microsoft.com → your project → Settings → Overview → Project ID.' }
          - { name: ga4_id, label: Google Analytics 4 measurement ID, widget: string, required: false, pattern: ['^(G-[A-Za-z0-9]{4,15})?$', 'Starts with G-, e.g. G-ABC123XYZ'], hint: 'Optional. analytics.google.com → Admin → Data streams → your web stream → Measurement ID.' }
          - { name: cloudflare_token, label: Cloudflare Web Analytics token, widget: string, required: false, pattern: ['^([a-fA-F0-9]{32})?$', '32 letters and numbers'], hint: 'Optional, cookie-free visit counts. Cloudflare → Analytics & Logs → Web Analytics → your site → the token in the JS snippet.' }
          - { name: respect_privacy_signals, label: Skip visitors with Do Not Track or Global Privacy Control, widget: boolean, default: true }
          - { name: consent, label: Ask for cookie consent, widget: select, default: europe, options: [{ label: 'Visitors in Europe (EU, UK and other European time zones)', value: europe }, { label: Every visitor, value: everyone }, { label: 'Never (not recommended if you get European visitors)', value: off }], hint: 'Clarity and Google Analytics load only after consent. Cloudflare Web Analytics is cookie-free and never asks.' }
          - { name: consent_text, label: Banner text, widget: text }
          - { name: consent_accept, label: Accept button, widget: string, default: Accept }
          - { name: consent_decline, label: Decline button, widget: string, default: Decline }

      - name: feedback
        label: Feedback form
        file: content/feedback.yaml
        fields:
          - { name: enabled, label: Show the feedback form, widget: boolean, default: true }
          - name: delivery
            label: How feedback reaches you
            widget: select
            default: email_app
            options:
              - { label: "Visitor's email app (no setup; they press Send)", value: email_app }
              - { label: "Web3Forms (sent straight to your inbox; free access key)", value: web3forms }
              - { label: "Formspree (sent straight to your inbox; form ID)", value: formspree }
            hint: "The email app option sends to the email in Let's Talk. For Web3Forms, get a free access key at web3forms.com (it is emailed to you, and feedback goes to that address). For Formspree, create a form at formspree.io and use its ID (the part after /f/)."
          - { name: service_key, label: Web3Forms access key or Formspree form ID, widget: string, required: false, hint: "Leave empty for the email app option. Without a key, the form falls back to the email app." }
          - { name: captcha, label: Spam check (hCaptcha), widget: boolean, default: false, hint: "Web3Forms only. Adds an \"I am human\" check that must be passed before feedback sends. It loads only when someone opens the form." }
          - { name: button_label, label: Button text, widget: string, default: Feedback, hint: "Used for the footer link and the bottom tab." }
          - { name: bottom_tab, label: Show the Feedback tab at the bottom of every page, widget: boolean, default: true, hint: "Pinned to the bottom-left edge. The footer link is always there." }
          - { name: heading, label: Form heading, widget: string, default: Share feedback }
          - { name: intro, label: Intro, widget: text, required: false }
          - name: rating
            label: Rating
            widget: object
            collapsed: true
            fields:
              - { name: show, label: Ask for a 1–5 rating, widget: boolean, default: true }
              - { name: label, label: Question, widget: string, default: How useful was this site? }
              - { name: low, label: Label for 1, widget: string, default: Not useful }
              - { name: high, label: Label for 5, widget: string, default: Very useful }
          - { name: topic_label, label: Topic question, widget: string, default: Topic }
          - { name: topics, label: Topics, widget: list, required: false, hint: "Choices visitors pick from. Leave empty to hide the topic menu." }
          - { name: message_label, label: Message label, widget: string, default: Your feedback }
          - { name: message_placeholder, label: Message placeholder, widget: string, required: false }
          - { name: ask_name, label: Ask for their name, widget: select, default: optional, options: [{ label: Optional, value: optional }, { label: Required, value: required }, { label: "Don't ask", value: hidden }] }
          - { name: ask_email, label: Ask for their email, widget: select, default: optional, options: [{ label: Optional, value: optional }, { label: Required, value: required }, { label: "Don't ask", value: hidden }] }
          - { name: submit_label, label: Send button text, widget: string, default: Send feedback }
          - { name: success_message, label: Thank-you message, widget: string, hint: "Shown after feedback is sent through Web3Forms or Formspree. With the email app option, visitors are told to press Send instead." }
          - { name: subject, label: Email subject, widget: string, default: Site feedback, hint: "The topic is added after it, e.g. Site feedback: Design." }

      - name: chat
        label: Chat
        file: content/chat.yaml
        fields:
          - { name: enabled, label: Show the chat button, widget: boolean, default: true, hint: "A floating button at the bottom-right of every page." }
          - { name: button_label, label: Button text, widget: string, default: Chat, hint: "Shown next to the icon on tablets and computers; phones show the icon only." }
          - { name: title, label: Chat title, widget: string, default: Chat with Jawahar }
          - { name: status, label: Status line, widget: string, required: false, hint: "e.g. Usually replies within a day" }
          - { name: greeting, label: Greeting, widget: text, hint: "The first message visitors see." }
          - name: faqs
            label: Suggested questions
            label_singular: Question
            widget: list
            required: false
            summary: '{{fields.question}}'
            hint: "Shown as buttons in the chat, in this order; drag to reorder. The chat answers them instantly on the page."
            fields:
              - { name: question, label: Question, widget: string, hint: "Keep it short: it's a button label." }
              - { name: answer, label: Answer, widget: text }
              - { name: link_label, label: Link button text, widget: string, required: false, hint: "Optional button under the answer, e.g. Request a meeting." }
              - { name: link, label: Link, widget: string, required: false, hint: "Where the button goes: a section (#connect for Let's Talk, #career, #toolkit), a page on the site (/resume.pdf, /blog/), or a full https:// address." }
              - { name: show, label: Show this question, widget: boolean, default: true, hint: "Turn off to hide it without deleting it." }
          - name: channel
            label: Where typed messages go
            widget: select
            default: email
            options:
              - { label: "Web3Forms (sent straight to your inbox; visitors add their email for your reply)", value: web3forms }
              - { label: "Email (your email app opens with the message; uses the email in Let's Talk)", value: email }
              - { label: "WhatsApp to my phone (your number becomes visible in the page)", value: whatsapp }
              - { label: "Telegram (your number stays private; uses your Telegram username)", value: telegram }
              - { label: "Tawk.to live chat (reply from the Tawk app on your phone; with a Web3Forms key, visitors can also leave a message for your inbox)", value: tawk }
            hint: "If the setting for the chosen option is empty, the chat uses email."
          - { name: web3forms_key, label: Web3Forms access key, widget: string, required: false, hint: "Leave empty to use the key from the Feedback form." }
          - { name: ask_email, label: "Visitor's email (Web3Forms)", widget: select, default: required, options: [{ label: Required, value: required }, { label: Optional, value: optional }], hint: "Needed for you to reply." }
          - { name: captcha, label: "Spam check (hCaptcha, Web3Forms)", widget: boolean, default: true, hint: "Appears once a visitor starts typing a message." }
          - { name: whatsapp_number, label: WhatsApp number, widget: string, required: false, hint: "With country code. Only used when WhatsApp is chosen above, and then anyone can see it in the page source. This file is also visible in your public GitHub repository, so leave it empty unless you use WhatsApp.", pattern: ['^[+0-9 ()-]*$', 'Digits, spaces, +, - and brackets only'] }
          - { name: telegram_username, label: Telegram username, widget: string, required: false, hint: "Telegram → Settings → Username (e.g. @jawahar). Set Phone number privacy to Nobody to keep your number hidden.", pattern: ['^@?([A-Za-z0-9_]{5,32})?$', '5–32 letters, numbers or underscores'] }
          - { name: tawk_property_id, label: Tawk.to property ID, widget: string, required: false, hint: "tawk.to → Administration → Chat Widget → the Direct Chat Link is tawk.to/chat/<property ID>/<widget ID>." }
          - { name: tawk_widget_id, label: Tawk.to widget ID, widget: string, required: false }
          - { name: input_placeholder, label: Message box placeholder, widget: string, default: Type a message… }
          - { name: handoff_note, label: Note under the message box, widget: string, hint: "{channel} is replaced with your email app, WhatsApp, Telegram or live chat." }

      - name: privacy
        label: Privacy page
        file: content/privacy.md
        fields:
          - { name: title, label: Title, widget: string, default: Privacy }
          - { name: body, label: Page text, widget: markdown, hint: Shown at /privacy/ and linked from the footer and the cookie banner. }

      - name: sections
        label: Section names & order
        file: content/sections.yaml
        fields:
          - name: about
            label: "About"
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Label, widget: string }
              - { name: icon, label: Icon, widget: string, hint: 'Any icon name from https://lucide.dev/icons' }
              - { name: order, label: Order, widget: number, value_type: int }
              - { name: enabled, label: Show on site, widget: boolean, default: true }
              - { name: collapsed, label: Start collapsed, widget: boolean, default: false }
          - name: career
            label: "Career"
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Label, widget: string }
              - { name: icon, label: Icon, widget: string, hint: 'Any icon name from https://lucide.dev/icons' }
              - { name: order, label: Order, widget: number, value_type: int }
              - { name: enabled, label: Show on site, widget: boolean, default: true }
              - { name: collapsed, label: Start collapsed, widget: boolean, default: false }
          - name: education
            label: "Education"
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Label, widget: string }
              - { name: icon, label: Icon, widget: string, hint: 'Any icon name from https://lucide.dev/icons' }
              - { name: order, label: Order, widget: number, value_type: int }
              - { name: enabled, label: Show on site, widget: boolean, default: true }
              - { name: collapsed, label: Start collapsed, widget: boolean, default: false }
          - name: certifications
            label: "Certifications"
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Label, widget: string }
              - { name: icon, label: Icon, widget: string, hint: 'Any icon name from https://lucide.dev/icons' }
              - { name: order, label: Order, widget: number, value_type: int }
              - { name: enabled, label: Show on site, widget: boolean, default: true }
              - { name: collapsed, label: Start collapsed, widget: boolean, default: false }
          - name: case-studies
            label: "Case Studies"
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Label, widget: string }
              - { name: icon, label: Icon, widget: string, hint: 'Any icon name from https://lucide.dev/icons' }
              - { name: order, label: Order, widget: number, value_type: int }
              - { name: enabled, label: Show on site, widget: boolean, default: true }
              - { name: collapsed, label: Start collapsed, widget: boolean, default: false }
          - name: playbook
            label: "Playbook"
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Label, widget: string }
              - { name: icon, label: Icon, widget: string, hint: 'Any icon name from https://lucide.dev/icons' }
              - { name: order, label: Order, widget: number, value_type: int }
              - { name: enabled, label: Show on site, widget: boolean, default: true }
              - { name: collapsed, label: Start collapsed, widget: boolean, default: false }
          - name: toolkit
            label: "Toolkit"
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Label, widget: string }
              - { name: icon, label: Icon, widget: string, hint: 'Any icon name from https://lucide.dev/icons' }
              - { name: order, label: Order, widget: number, value_type: int }
              - { name: enabled, label: Show on site, widget: boolean, default: true }
              - { name: collapsed, label: Start collapsed, widget: boolean, default: false }
          - name: connect
            label: "Let's Talk"
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Label, widget: string }
              - { name: icon, label: Icon, widget: string, hint: 'Any icon name from https://lucide.dev/icons' }
              - { name: order, label: Order, widget: number, value_type: int }
              - { name: enabled, label: Show on site, widget: boolean, default: true }
              - { name: collapsed, label: Start collapsed, widget: boolean, default: false }

      - name: education
        label: Education
        file: content/education.yaml
        fields:
          - name: items
            label: Items
            label_singular: Item
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Degree, widget: string }
              - { name: detail, label: Institution, widget: string, required: false }
              - { name: year, label: Year, widget: string, required: false }
              - { name: logo, label: Logo, widget: string, required: false, hint: 'Simple Icons slug from https://simpleicons.org. Leave empty for a monogram.' }
              - { name: mark, label: Monogram, widget: string, required: false, hint: 'Initials for the tile, e.g. UTA.' }

      - name: certifications
        label: Certifications
        file: content/certifications.yaml
        fields:
          - name: items
            label: Items
            label_singular: Item
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Certification, widget: string }
              - { name: detail, label: Issued by, widget: string, required: false }
              - { name: year, label: Year, widget: string, required: false }
              - { name: logo, label: Logo, widget: string, required: false, hint: 'Simple Icons slug from https://simpleicons.org. Leave empty for a monogram.' }
              - { name: mark, label: Monogram, widget: string, required: false, hint: 'Initials for the tile, e.g. UTA.' }

      - name: toolkit
        label: Toolkit (skill matrix)
        file: content/toolkit.yaml
        fields:
          - name: t_shape
            label: T-shaped profile
            widget: object
            fields:
              - { name: title, label: Depth heading, widget: string, default: Depth }
              - { name: summary, label: Depth summary, widget: string, required: false }
          - name: overall
            label: Overall profile (Advanced–Expert and Expert domains form the T's depth)
            label_singular: Domain
            widget: list
            summary: '{{fields.name}} · {{fields.level}}'
            fields:
              - { name: name, label: Domain, widget: string }
              - { name: level, label: Level, widget: select, options: [{ label: Expert, value: expert }, { label: Advanced–Expert, value: advanced-expert }, { label: Advanced, value: advanced }, { label: Working–Advanced, value: working-advanced }, { label: Working, value: working }, { label: Exposure, value: exposure }] }
          - name: groups
            label: Skill groups
            label_singular: Group
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { name: id, label: ID, widget: string, hint: Short unique name without spaces. }
              - { name: label, label: Heading, widget: string }
              - { name: icon, label: Icon, widget: string, default: wrench, hint: 'Any icon name from https://lucide.dev/icons' }
              - name: items
                label: Skills
                label_singular: Skill
                widget: list
                summary: '{{fields.name}} · {{fields.level}}'
                fields:
                  - { name: name, label: Skill, widget: string }
                  - { name: level, label: Level, widget: select, required: false, options: [{ label: Expert, value: expert }, { label: Advanced–Expert, value: advanced-expert }, { label: Advanced, value: advanced }, { label: Working–Advanced, value: working-advanced }, { label: Working, value: working }, { label: Exposure, value: exposure }] }
                  - { name: evidence, label: Evidence, widget: string, required: false, hint: 'One line on where you used it, e.g. "40+ integrations".' }
                  - { name: logo, label: Logo, widget: string, required: false, hint: 'Simple Icons slug from https://simpleicons.org. Matched automatically for well-known names.' }

  - name: career
    label: Career
    label_singular: Role
    folder: content/career
    extension: md
    format: frontmatter
    create: true
    identifier_field: org
    slug: '{{fields.start}}-{{slug}}'
    summary: '{{title}} · {{org}} ({{start}})'
    sortable_fields: [start, org]
    fields:
      - { name: title, label: Job title, widget: string }
      - { name: org, label: Company, widget: string }
      - { name: via, label: Placed through, widget: string, required: false, hint: 'Consultancy or agency, if any.' }
      - { name: product, label: Product or program, widget: string, required: false }
      - { name: start, label: Start, widget: string, pattern: ['^\d{4}-\d{2}$', 'Use YYYY-MM, e.g. 2026-04'] }
      - { name: end, label: End, widget: string, required: false, pattern: ['^(\d{4}-\d{2})?$', 'Use YYYY-MM, or leave empty for Present'] }
      - { name: location, label: Location, widget: string, required: false }
      - { name: logo, label: Logo, widget: string, required: false, hint: 'Simple Icons slug from https://simpleicons.org. Leave empty for a monogram.' }
      - { name: mark, label: Monogram, widget: string, required: false, hint: 'Initials for the tile, e.g. LS. Default: from the company name.' }
      - { name: earlier, label: List under "Earlier career", widget: boolean, default: false }
      - { name: status, label: Status, widget: select, options: [planned, draft, published], default: published }
      - { name: highlights, label: Highlights, widget: list, required: false }
      - { name: to_verify, label: Needs verification (never shown), widget: list, required: false, hint: Park unconfirmed bullets here; move them to Highlights once checked. }
      - { name: short, label: Short name, widget: string, required: false, hint: "Column label in Toolkit's Skills by role map, e.g. Levi's. Default: the company name." }
      - name: skills
        label: Skills shown in Toolkit (Skills by role)
        label_singular: Skill
        widget: list
        required: false
        summary: '{{fields.name}}'
        hint: 'Each entry fills one cell in the Skills by role map. Easier: edit every role at once at /admin/skills-by-role/.'
        fields:
          - { name: name, label: Skill, widget: string }
          - { name: evidence, label: Evidence from this role, widget: string, required: false, hint: Shown when a visitor selects the cell. }

  - name: blog
    label: Blog
    label_singular: Blog post
    folder: content/blog
    extension: md
    format: frontmatter
    create: true
    slug: '{{year}}-{{month}}-{{slug}}'
    summary: '{{title}} [{{status}}]'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: slug, label: Web address, widget: string, required: false, hint: 'The end of the post link, e.g. my-first-post gives jawaharchiluveru.pro/blog/my-first-post/. Lowercase letters, numbers and dashes. Leave empty to use the file name.', pattern: ['^[a-z0-9-]*$', 'Lowercase letters, numbers and dashes only'] }
      - { name: summary, label: Summary, widget: text, hint: 'One or two sentences. Shown on the blog page, in search results and in link previews.' }
      - { name: date, label: Published, widget: datetime, type: date }
      - { name: updated, label: Last updated, widget: datetime, type: date, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: status, label: Status, widget: select, options: [planned, draft, published], default: draft, hint: Only published posts appear on the live site. }
      - { name: body, label: Post, widget: markdown }

  - name: case-studies
    label: Case Studies
    label_singular: Case study
    folder: content/case-studies
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    summary: '{{title}} [{{status}}]'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: text, hint: One-sentence hook shown on the card. }
      - { name: domain, label: Domain, widget: string, required: false, hint: 'e.g. Platform Engineering' }
      - { name: client, label: Client, widget: string, required: false }
      - { name: year, label: Year, widget: number, value_type: int, required: false }
      - { name: outcome, label: Headline outcome, widget: string, required: false, hint: 'e.g. 25% lower API latency' }
      - { name: order, label: Order, widget: number, value_type: int, default: 99 }
      - { name: status, label: Status, widget: select, options: [planned, draft, published], default: draft, hint: Only published items appear on the live site. }
      - { name: body, label: Story, widget: markdown, default: "## Context\n\n## Problem\n\n## Approach\n\n## Outcome\n" }

  - name: playbook
    label: Playbook
    label_singular: Artifact
    folder: content/playbook
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    summary: '{{kind}}: {{title}} [{{status}}]'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: kind, label: Type, widget: select, options: [PRD, Roadmap, ROI Model, White Paper, Decision Memo, Metrics Framework, Runbook, Template] }
      - { name: summary, label: Summary, widget: text }
      - { name: file, label: Download (optional), widget: file, required: false, hint: Remove confidential details before uploading. }
      - { name: order, label: Order, widget: number, value_type: int, default: 99 }
      - { name: status, label: Status, widget: select, options: [planned, draft, published], default: draft }
      - { name: body, label: Description, widget: markdown, required: false }
